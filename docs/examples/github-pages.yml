# Optional: play the web build from a URL (e.g. on your phone) by hosting it on GitHub Pages.
# NOT enabled: I did not publish the game for you. To use it:
#   1. copy this file to .github/workflows/pages.yml
#   2. repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   3. push to main. The site appears at https://wschiks.github.io/skiword/
name: Deploy web build to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
